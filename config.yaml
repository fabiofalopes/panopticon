  # ── CLIProxyAPI (OAuth subscription bridge) ───────────
  # Route: LiteLLM → cli-proxy-api (:8317) → subscription
  # Uncomment after adding OAuth subscriptions via:
  #   docker exec -it cli-proxy-api ./cli-proxy-api --auth <provider>
  # The api_key matches cliproxy-config.yaml → api-keys

  - model_name: glm-5.2-via-cliproxy
    litellm_params:
      model: openai/glm-5.2-cliproxy
      api_base: http://cli-proxy-api:8317/v1
      api_key: sk-cliproxy-internal
    model_info:
      input_cost_per_token: 0.00000146   # Same as glm-5.2 (routes to Alibaba)
      output_cost_per_token: 0.00000458

