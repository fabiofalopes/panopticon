model_list:
  # ── modelos.ai.ulusofona.pt ──────────────────────────
  - model_name: amalia-9b
    litellm_params:
      model: openai/amalia-9b
      api_base: https://modelos.ai.ulusofona.pt/v1
      api_key: os.environ/MODELOS_AI_KEY_API_KEY

  - model_name: omnicoder-9b
    litellm_params:
      model: openai/omnicoder-9b
      api_base: https://modelos.ai.ulusofona.pt/v1
      api_key: os.environ/MODELOS_AI_KEY_API_KEY

  - model_name: ornith-9b
    litellm_params:
      model: openai/ornith-9b
      api_base: https://modelos.ai.ulusofona.pt/v1
      api_key: os.environ/MODELOS_AI_KEY_API_KEY

  # ── Alibaba Cloud Token Plan ──────────────────────────
  # OpenAI-compatible: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  # Anthropic-compatible: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1/messages

  - model_name: qwen3.8-max-preview
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.00000025   # 10% trial pricing (est. from qwen3.7-max tier)
      output_cost_per_token: 0.00000075

  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.00000032   # $0.32/1M input (≤256K tier)
      output_cost_per_token: 0.00000128  # $1.28/1M output (≤256K tier)

  - model_name: qwen3.7-max
    litellm_params:
      model: openai/qwen3.7-max
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.0000025    # $2.50/1M input (list; 50% promo active → $1.25)
      output_cost_per_token: 0.0000075   # $7.50/1M output (list; 50% promo active → $3.75)

  - model_name: qwen3.6-flash
    litellm_params:
      model: openai/qwen3.6-flash
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.00000026   # $0.26/1M input (≤256K tier)
      output_cost_per_token: 0.00000156  # $1.56/1M output (≤256K tier)

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.0000025    # $2.50/1M input (via DashScope; DeepSeek direct is $0.44)
      output_cost_per_token: 0.000005    # $5.00/1M output (via DashScope; DeepSeek direct is $0.87)

  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/ALIBABA_TOKEN_PLAN_KEY_API_KEY
    model_info:
      input_cost_per_token: 0.00000146   # $1.46/1M input (via DashScope; Z.ai direct is $1.40)
      output_cost_per_token: 0.00000458  # $4.58/1M output (via DashScope; Z.ai direct is $4.40)

  # ── Mistral AI (Vibe plan) ───────────────────────────────
  # OpenAI-compatible: https://api.mistral.ai/v1
  # Auth: Vibe subscription API key (from macOS Keychain ai.mistral.vibe)
  # extra_headers mimic Vibe CLI so requests match the plan's expected client

  - model_name: mistral-medium
    litellm_params:
      model: openai/mistral-medium-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.0000015    # $1.50/1M
      output_cost_per_token: 0.0000075   # $7.50/1M

  - model_name: mistral-large
    litellm_params:
      model: openai/mistral-large-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.0000005    # $0.50/1M
      output_cost_per_token: 0.0000015   # $1.50/1M

  - model_name: mistral-small
    litellm_params:
      model: openai/mistral-small-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.00000015   # $0.15/1M
      output_cost_per_token: 0.0000006   # $0.60/1M

  - model_name: codestral
    litellm_params:
      model: openai/codestral-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.0000003    # $0.30/1M
      output_cost_per_token: 0.0000009   # $0.90/1M

  - model_name: magistral-medium
    litellm_params:
      model: openai/magistral-medium-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.000002     # $2.00/1M
      output_cost_per_token: 0.000005    # $5.00/1M

  - model_name: magistral-small
    litellm_params:
      model: openai/magistral-small-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.0000005    # $0.50/1M
      output_cost_per_token: 0.0000015   # $1.50/1M

  - model_name: voxtral-small
    litellm_params:
      model: openai/voxtral-small-latest
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY_API_KEY
      extra_headers:
        User-Agent: "mistral-client-python/Mistral-Vibe/2.21.0"
    model_info:
      input_cost_per_token: 0.0000001    # $0.10/1M text + $0.004/min audio
      output_cost_per_token: 0.0000004   # $0.40/1M

  # ── OpenCode Zen (free models) ────────────────────────
  # Endpoint: https://opencode.ai/zen/v1
  # API key required (stored in secrets as ZEN_API_KEY)
  # Rate-limited: ~11h cooldown when free quota exceeded
  # Privacy: free models may use data for training — no sensitive data

  - model_name: big-pickle
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY_API_KEY

  - model_name: deepseek-v4-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY_API_KEY

  - model_name: mimo-v2.5-free
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY_API_KEY

  - model_name: north-mini-code-free
    litellm_params:
      model: openai/north-mini-code-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY_API_KEY

  - model_name: nemotron-3-ultra-free
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY_API_KEY

