litellm_settings:
  drop_params: true
  success_callback: ["langfuse"]
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

general_settings:
  master_key: sk-local-litellm
  database_url: postgresql://litellm:litellm-pw@litellm-db:5432/litellm
